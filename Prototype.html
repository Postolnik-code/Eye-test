  label { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:4px 0; }

  legend { color:#9aa0ab; font-size:12px; padding:0 6px; }
  pre { background:#15171b; padding:8px; border-radius:8px; font-size:11px; margin:0; white-space:pre-wrap; max-height:220px; overflow:auto; }
  .hint { color:#8a909b; font-size:12px; margin:0; }
