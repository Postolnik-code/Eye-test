<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Проверка очков</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#000;color:#e8e8e8;font-family:-apple-system,system-ui,"Segoe UI",Arial,sans-serif}
  body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  #stage{position:sticky;top:0;z-index:1;height:42vh;min-height:220px;background:#000;
         display:flex;align-items:center;justify-content:center}
  #stage svg{width:96%;height:auto;max-height:100%;display:block}
  #panel{background:#22252b;padding:14px;padding-bottom:calc(20px + env(safe-area-inset-bottom));flex:1}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
  .top b{font-size:17px}
  #prog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
  #prog i{height:6px;border-radius:3px;background:#3a3e47}
  #prog i.on{background:#6aa9ff}
  h2{font-size:20px;margin:6px 0}
  p{margin:6px 0 12px;line-height:1.4}
  button{display:block;width:100%;font:inherit;font-size:17px;text-align:left;padding:13px 16px;margin:8px 0;
         border-radius:10px;border:1px solid #444a55;background:#2e323b;color:#fff;-webkit-tap-highlight-color:transparent}
  button:active{background:#454b58}
  button.primary{background:#2f6fd6;border-color:#2f6fd6;text-align:center}
  button.small{width:auto;display:inline-block;font-size:14px;padding:8px 12px;margin:0}
  .note{background:#3a2f1a;border:1px solid #6b5420;padding:10px;border-radius:8px;font-size:15px}
  details{margin-top:14px;border:1px solid #3a3e47;border-radius:8px;padding:8px 10px}
  summary{color:#9aa0ab;font-size:14px}
  label{display:flex;justify-content:space-between;margin-top:12px;font-size:15px}
  input[type=range]{width:100%;height:34px}
  .hint{color:#8a909b;font-size:13px}
  @media (orientation:landscape){
    body{flex-direction:row;height:100vh;height:100dvh}
    #stage{position:static;flex:1;height:auto;min-height:0}
    #panel{flex:0 0 340px;overflow-y:auto}
  }
</style>
</head>
<body>

<div id="stage">
  
    
    
  
</div>

<div id="panel">
  <div class="top">
    <b>Проверка красно-зелёных очков</b>
    <button id="fs" class="small">⛶ Полный экран</button>
  </div>
  <div id="prog"><i></i><i></i><i></i><i></i></div>
  <div id="content"></div>
  <p
