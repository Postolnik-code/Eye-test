<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка очков — панель специалиста</title>
<style>
  :root { --red:#FF0000; --green:#00C800; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui, "Segoe UI", Arial, sans-serif;
         background:#1b1d22; color:#e8e8e8; height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 20px; background:#25282f; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  main { flex:1; display:grid; grid-template-columns:1fr 380px; min-height:0; }
  #stage { background:#000; display:flex; align-items:center; justify-content:space-evenly; }
  #stage svg { width:32vmin; height:32vmin; }
  #panel { padding:20px; background:#22252b; overflow:auto; display:flex; flex-direction:column; gap:16px; }
  .steps { display:flex; gap:6px; }
  .steps span { flex:1; height:6px; border-radius:3px; background:#3a3e47; }
  .steps span.on { background:#6aa9ff; }
  h2 { font-size:18px; margin:0 0 6px; }
  p { margin:0 0 10px; line-height:1.45; color:#c9ccd3; }
  .btns { display:flex; flex-direction:column; gap:8px; }
  button { font:inherit; padding:11px 14px; border-radius:8px; border:1px solid #444a55;
           background:#2e323b; color:#fff; cursor:pointer; text-align:left; }
  button:hover { background:#3a3f4a; }
  button.primary { background:#2f6fd6; border-color:#2f6fd6; text-align:center; }
  button.small { padding:6px 10px; font-size:13px; text-align:center; }
  .result { padding:12px; border-radius:8px; }
  .ok   { background:#163a24; border:1px solid #2f8a50; }
  .warn { background:#3d3315; border:1px solid #a88a2a; }
  .err  { background:#3d1a1a; border:1px solid #a33; }
  fieldset { border:1px solid #3a3e47; border-radius:8px; padding:12px; }
  legend { padding:0 6px; color:#9aa0ab; font-size:13px; }
  .row { display:grid; grid-template-columns:80px 1fr 64px; gap:8px; align-items:center; margin:6px 0;
         padding:4px; border-radius:6px; }
  .row.hl { background:#4a3d12; outline:1px solid #c9a227; }
  .row code { font-size:12px; color:#9aa0ab; }
  input[type=range] { width:100%; }
  label.chk { display:flex; gap:8px; align-items:center; margin-top:8px; font-size:14px; }
  pre { background:#15171b; padding:10px; border-radius:8px; font-size:12px; overflow:auto; max-height:240px; margin:0; }
  .hint { font-size:12px; color:#8a909b; }
  @media (max-width:800px){ main{ grid-template-columns:1fr; } #stage{ min-height:45vh; } }
</style>
</head>
<body>

<header>
  <h1>Проверка красно-зелёных очков</h1>
  <button class="small" id="fs">⛶ Полный экран</button>
</header>

<main>
  <section id="stage">
    
      
    
    
      
    
  </section>

  <aside id="panel">
    <div class="steps"><span></span><span></span><span></span><span></span></div>
    <div id="content"></div>

    <fieldset id="manual">
      <legend>Ручная настройка</legend>
      <div class="row" id="rowRed">
        <span>Красный</span>
        <input type="range" id="r" min="40" max="255" value="255">
        <code id="rHex"></code>
      </div>
      <div class="row" id="rowGreen">
        <span>Зелёный</span>
        <input type="range" id="g" min="40" max="255" value="200">
        <code id="gHex"></code>
      </div>
      <label class="chk"><input type="checkbox" id="swap"> Поменять глаза местами (красный фильтр слева)</label>
      <p class="hint">Уменьшайте яркость того цвета, который «просвечивает», пока лишняя фигура не исчезнет.
        Не опускайте слишком низко: своя фигура должна оставаться хорошо видна.</p>
    </fieldset>
  </aside>
</main>

<script>
const $ = s => document.querySelector(s);
const hex = (r,g,b) => '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('').toUpperCase();

const S = { step:0, right:null, left:null, r:255, g:200, swapped:false, attempts:0, res:null };
const ANS = { star:'Только звезда ★', circle:'Только круг ●', both:'Обе фигуры', none:'Ничего не видно' };
const NAME = { star:'красная звезда', circle:'зелёный круг' };

// Загрузка сохранённых настроек
try {
  const saved = JSON.parse(localStorage.getItem('glasses_check'));
  if (saved) { S.r = parseInt(saved.red_hex.slice(1,3),16); S.g = parseInt(saved.green_hex.slice(3,5),16); S.swapped = saved.swapped; }
} catch(e){}

function applyColors(){
  const rh = hex(S.r,0,0), gh = hex(0,S.g,0);
  document.documentElement.style.setProperty('--red', rh);
  document.documentElement.style.setProperty('--green', gh);
  $('#rHex').textContent = rh; $('#gHex').textContent = gh;
  $('#r').value = S.r; $('#g').value = S.g; $('#swap').checked = S.swapped;
}

function evaluate(){
  const R = S.right, L = S.left;
  if (R==='star'   && L==='circle') return { status:'ok', swapped:false };
  if (R==='circle' && L==='star')   return { status:'ok', swapped:true };
  if (R==='none' || L==='none')     return { status:'dark' };
  if (R==='both' || L==='both'){
    const leak = new Set();
    if (R==='both') (L==='star'||L==='circle') ? leak.add(L) : (leak.add('star'), leak.add('circle'));
    if (L==='both') (R==='star'||R==='circle') ? leak.add(R) : (leak.add('star'), leak.add('circle'));
    return { status:'crosstalk', leak:[...leak] };
  }
  return { status:'same' }; // оба глаза видят одну и ту же фигуру
}

function buildLog(){
  return { glasses_check: {
    type: 'red-green',
    red_eye: S.swapped ? 'left' : 'right',
    swapped: S.swapped,
    red_hex: hex(S.r,0,0),
    green_hex: hex(0,S.g,0),
    crosstalk_ok: S.res?.status === 'ok',
    attempts: S.attempts,
    answers: { right_eye: S.right, left_eye: S.left },
    timestamp: new Date().toISOString(),
    source: 'manual'
  }};
}

function answerButtons(){
  return Object.entries(ANS).map(([k,v]) => `<button data-ans="${k}">${v}</button>`).join('');
}

function restart(){ S.right = null; S.left = null; S.res = null; S.step = 1; render(); }

function render(){
  document.querySelectorAll('.steps span').forEach((el,i) => el.classList.toggle('on', i <= S.step));
  $('#rowRed').classList.remove('hl'); $('#rowGreen').classList.remove('hl');
  const c = $('#content');

  if (S.step === 0){
    c.innerHTML = `
      <h2>Подготовка</h2>
      <p>1. Яркость экрана на максимум, свет в комнате приглушён.</p>
      <p>2. Специалист надевает красно-зелёные очки.</p>
      <p>3. Сидите на том же расстоянии от экрана, что и ребёнок.</p>
      <div class="btns"><button class="primary" id="go">Начать проверку</button></div>`;
    $('#go').onclick = () => { S.step = 1; render(); };
  }

  else if (S.step === 1){
    c.innerHTML = `
      <h2>Шаг 1. Закройте ЛЕВЫЙ глаз</h2>
      <p>Что видно <b>правым</b> глазом?</p>
      <div class="btns">${answerButtons()}</div>`;
    c.querySelectorAll('[data-ans]').forEach(b => b.onclick = () => { S.right = b.dataset.ans; S.step = 2; render(); });
  }

  else if (S.step === 2){
    c.innerHTML = `
      <h2>Шаг 2. Закройте ПРАВЫЙ глаз</h2>
      <p>Что видно <b>левым</b> глазом?</p>
      <div class="btns">${answerButtons()}</div>`;
    c.querySelectorAll('[data-ans]').forEach(b => b.onclick = () => {
      S.left = b.dataset.ans; S.attempts++;
      S.res = evaluate();
      if (S.res.status === 'ok'){ S.swapped = S.res.swapped; applyColors(); }
      S.step = 3; render();
    });
  }

  else {
    const r = S.res;
    let html = '';
    if (r.status === 'ok'){
      html = `<div class="result ok"><h2>✅ ${r.swapped ? 'Фильтры наоборот' : 'Всё верно'}</h2>
        <p>${r.swapped
          ? 'Красный фильтр слева. Режим «Поменять глаза местами» включён автоматически.'
          : 'Красный фильтр справа, каждый глаз видит только свою фигуру.'}</p></div>
        <div class="btns">
          <button class="primary" id="save">Сохранить и продолжить</button>
          <button id="dl">Скачать JSON</button>
          <button id="again">Проверить заново</button>
        </div>
        <pre id="json"></pre>`;
    }
    else if (r.status === 'crosstalk'){
      html = `<div class="result warn"><h2>⚠️ Видна вторая фигура</h2>
        <p>Просвечивает: <b>${r.leak.map(k => NAME[k]).join(' и ')}</b>.
        Уменьшите яркость этого цвета в «Ручной настройке» ниже и проверьте снова.</p></div>
        <div class="btns"><button class="primary" id="again">Проверить снова</button></div>`;
      if (r.leak.includes('star'))   $('#rowRed').classList.add('hl');
      if (r.leak.includes('circle')) $('#rowGreen').classList.add('hl');
    }
    else if (r.status === 'dark'){
      html = `<div class="result err"><h2>❌ Фигура не видна</h2>
        <p>Проверьте, что яркость экрана на максимуме и очки надеты правильно.
        Если вы уменьшали яркость цветов, верните её выше.</p></div>
        <div class="btns"><button class="primary" id="again">Проверить снова</button></div>`;
    }
    else {
      html = `<div class="result err"><h2>❌ Оба глаза видят одно и то же</h2>
        <p>Возможно, очки надеты не до конца, один фильтр повреждён или очки не красно-зелёные.
        Проверьте очки и повторите.</p></div>
        <div class="btns"><button class="primary" id="again">Проверить снова</button></div>`;
    }
    c.innerHTML = html;

    $('#again').onclick = restart;
    if (r.status === 'ok'){
      const log = buildLog();
      $('#json').textContent = JSON.stringify(log, null, 2);
      $('#save').onclick = () => {
        localStorage.setItem('glasses_check', JSON.stringify(log.glasses_check));
        $('#save').textContent = '✔ Сохранено';
      };
      $('#dl').onclick = () => {
        const blob = new Blob([JSON.stringify(log, null, 2)], { type:'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'glasses_check.json';
        a.click();
        URL.revokeObjectURL(a.href);
      };
    }
  }
}

// Ручная настройка
$('#r').oninput = e => { S.r = +e.target.value; applyColors(); };
$('#g').oninput = e => { S.g = +e.target.value; applyColors(); };
$('#swap').onchange = e => { S.swapped = e.target.checked; };

// Полный экран
$('#fs').onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};

applyColors();
render();
</script>
</body>
</html>
