<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Проверка очков</title>
<script>
window.onerror = function(m, u, l){
 var d = document.createElement('div');
 d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99;background:#b00;color:#fff;padding:10px;font:14px sans-serif';
 d.textContent = 'Ошибка: ' + m + ' (строка ' + l + ')';
 (document.body || document.documentElement).appendChild(d);
};
</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#e8e8e8;font-family:-apple-system,system-ui,Arial,sans-serif}
body{display:flex;flex-direction:column;min-height:100vh}
#stage{height:40vh;min-height:200px;background:#000;display:flex;align-items:center;justify-content:space-evenly}
#star,#circ{width:36vmin;height:36vmin;max-width:240px;max-height:240px}
#star{background:rgb(255,0,0);
 -webkit-clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
 clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
#circ{background:rgb(0,255,0);border-radius:50%}
#panel{background:#22252b;padding:14px 14px 30px;flex:1}
#prog{display:flex;gap:6px;margin:6px 0 14px}
#prog i{flex:1;height:6px;border-radius:3px;background:#3a3e47}
#prog i.on{background:#6aa9ff}
h1{font-size:18px;margin:0}
h2{font-size:20px;margin:6px 0}
p{margin:6px 0 12px;line-height:1.4}
button{display:block;width:100%;font-size:17px;text-align:left;padding:13px 16px;margin:8px 0;border-radius:10px;border:1px solid #444a55;background:#2e323b;color:#fff}
button.ok{background:#1f6b3a;border-color:#1f6b3a}
button.small{width:auto;display:inline-block;font-size:14px;padding:8px 12px}
.note{background:#3a2f1a;border:1px solid #6b5420;padding:10px;border-radius:8px;font-size:15px;margin:10px 0}
details{margin-top:16px;border:1px solid #3a3e47;border-radius:8px;padding:8px 10px}
summary{color:#9aa0ab;font-size:14px}
label{display:flex;justify-content:space-between;margin-top:12px;font-size:15px}
input[type=range]{width:100%}
.hint{color:#8a909b;font-size:13px}
@media (orientation:landscape){
 body{flex-direction:row;height:100vh}
 #stage{flex:1;height:auto;min-height:0}
 #panel{flex:0 0 340px;overflow-y:auto}
}
</style>
</head>
<body>

<div id="stage">
 <div id="star"></div>
 <div id="circ"></div>
</div>

<div id="panel">
 <h1>Проверка красно-зелёных очков</h1>
 <div id="prog"><i class="on"></i><i></i><i></i><i></i></div>
 <div id="content"></div>
 <details>
  <summary>Ручная настройка (для специалиста)</summary>
  <label>Красный — звезда <span id="rv">255</span></label>
  <input type="range" id="r" min="0" max="255" value="255">
  <label>Зелёный — круг <span id="gv">255</span></label>
  <input type="range" id="g" min="0" max="255" value="255">
  <label>Синий в круге <span id="bv">0</span></label>
  <input type="range" id="b" min="0" max="255" value="0">
  <button id="reset" class="small">Сбросить цвета</button>
 </details>
</div>

<script>
var KEY = 'eyeGlasses';
var s = {r:255, g:255, b:0, redEye:'left'};
try { var o = JSON.parse(localStorage.getItem(KEY)); if (o) for (var k in o) s[k] = o[k]; } catch(e) {}
var step = 0, msg = '';
var EYE = {left:'левый', right:'правый'};
function el(id){ return document.getElementById(id); }
function clamp(v){ return Math.max(0, Math.min(255, Math.round(v))); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e) {} }
function btn(a, t, c){ return '<button data-act="' + a + '"' + (c ? ' class="' + c + '"' : '') + '>' + t + '</button>'; }

function ensureFigures(){
 var st = el('stage');
 if (!st){ st = document.createElement('div'); st.id = 'stage'; document.body.insertBefore(st, document.body.firstChild); }
 if (!el('star')){ var a = document.createElement('div'); a.id = 'star'; st.appendChild(a); }
 if (!el('circ')){ var c = document.createElement('div'); c.id = 'circ'; st.appendChild(c); }
}
ensureFigures();

function paint(){
 el('star').style.background = 'rgb(' + s.r + ',0,0)';
 el('circ').style.background = 'rgb(0,' + s.g + ',' + s.b + ')';
 el('r').value = s.r; el('g').value = s.g; el('b').value = s.b;
 el('rv').textContent = s.r; el('gv').textContent = s.g; el('bv').textContent = s.b;
}

function view(){
 var bars = el('prog').children;
 for (var i = 0; i < 4; i++) bars[i].className = i <= step ? 'on' : '';
 var red = EYE[s.redEye];
 var green = EYE[s.redEye === 'left' ? 'right' : 'left'];
 var h = '';
 if (step === 0){
  h = '<h2>Шаг 1. Подготовка</h2><p>Яркость — на максимум. True Tone и Night Shift — выключить. Наденьте очки.</p><p><b>На каком глазу красная линза?</b></p>' +
   btn('redL', 'Красная — на левом глазу') + btn('redR', 'Красная — на правом глазу');
 } else if (step === 1){
  h = '<h2>Шаг 2. Красная линза</h2><p>Закройте ладонью <b>' + green + '</b> глаз. Смотрите <b>' + red + '</b>. Что видно?</p>' +
   btn('s1ok', '✓ Только звезду', 'ok') + btn('s1leak', 'Звезду и бледный круг') + btn('s1dim', 'Звезда тусклая или не видна') + btn('back0', '← Назад');
 } else if (step === 2){
  h = '<h2>Шаг 3. Зелёная линза</h2><p>Закройте <b>' + red + '</b> глаз. Смотрите <b>' + green + '</b>. Что видно?</p>' +
   btn('s2ok', '✓ Только круг', 'ok') + btn('s2leak', 'Круг и бледную звезду') + btn('s2dim', 'Круг тусклый или не виден') + btn('back1', '← Назад');
 } else if (step === 3){
  h = '<h2>Шаг 4. Оба глаза</h2><p>Откройте оба глаза. Видны звезда и круг одновременно?</p>' +
   btn('both', '✓ Да, видны обе — сохранить', 'ok') + btn('one', 'Видна только одна или «мигают»');
 } else {
  h = '<h2>Готово ✓</h2><p>Настройки сохранены на этом устройстве.</p><p class="hint">Звезда: rgb(' + s.r + ',0,0)<br>Круг: rgb(0,' + s.g + ',' + s.b + ')<br>Красная линза: ' + red + ' глаз</p>' +
   btn('again', 'Пройти заново');
 }
 if (msg) h = '<div class="note">' + msg + '</div>' + h;
 el('content').innerHTML = h;
 paint();
}

function act(a){
 msg = '';
 if (a === 'redL'){ s.redEye = 'left'; step = 1; }
 else if (a === 'redR'){ s.redEye = 'right'; step = 1; }
 else if (a === 's1ok'){ step = 2; }
 else if (a === 's1leak'){ s.g = clamp(s.g * 0.85); msg = 'Круг сделан тусклее. Посмотрите ещё раз.'; }
 else if (a === 's1dim'){ s.r = clamp(s.r * 1.15 + 5); msg = 'Звезда сделана ярче. Посмотрите ещё раз.'; }
 else if (a === 's2ok'){ step = 3; }
 else if (a === 's2leak'){ s.r = clamp(s.r * 0.85); msg = 'Звезда сделана тусклее. Посмотрите ещё раз.'; }
 else if (a === 's2dim'){
  if (s.g < 255){ s.g = clamp(s.g * 1.15 + 5); msg = 'Круг сделан ярче.'; }
  else { s.b = clamp(s.b + 40); msg = 'В круг добавлен бирюзовый оттенок.'; }
 }
 else if (a === 'back0'){ step = 0; }
 else if (a === 'back1'){ step = 1; }
 else if (a === 'both'){ save(); step = 4; }
 else if (a === 'one'){ msg = 'Если обоими глазами видна только одна фигура, сообщите об этом врачу.'; save(); step = 4; }
 else if (a === 'again'){ step = 0; }
 view();
}

el('content').addEventListener('click', function(e){
 var b = e.target.closest('button');
 if (b && b.getAttribute('data-act')) act(b.getAttribute('data-act'));
});
['r', 'g', 'b'].forEach(function(k){
 el(k).addEventListener('input', function(){ s[k] = +this.value; paint(); save(); });
});
el('reset').addEventListener('click', function(){ s.r = 255; s.g = 255; s.b = 0; save(); paint(); });

view();
</script>
</body>
</html>
