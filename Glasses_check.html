<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Проверка очков</title>
<script>
window.onerror = function(m, u, l){
 var d = document.createElement('div');
 d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99;background:#b00;color:#fff;padding:10px;font:14px sans-serif';
 d.textContent = 'Ошибка: ' + m + ' (строка ' + l + ')';
 (document.body || document.documentElement).appendChild(d);
};
<script>
const $ = s => document.querySelector(s);
const stage = $('#stage');

/* ---------- настройки ---------- */
const P = { gap_ms: 500, stimulus_max_ms: 3000, dwell_window_ms: 300, roi_center_radius_px: 80 };
try { Object.assign(P, JSON.parse(localStorage.getItem('protoParams')) || {}); } catch (e) {}
document.querySelectorAll('[data-k]').forEach(inp => {
  inp.value = P[inp.dataset.k];
  inp.addEventListener('change', () => {
    P[inp.dataset.k] = +inp.value;
    localStorage.setItem('protoParams', JSON.stringify(P));
  });
});

/* ---------- очки ---------- */
const swap = $('#swap');
const YELLOW = 'rgb(' + GL.r + ',' + GL.g + ',' + GL.b + ')';   // видно обоими глазами
function redEye() { return swap.checked ? (GL.redEye === 'left' ? 'right' : 'left') : GL.redEye; }
function showGlasses() {
  const l = redEye() === 'left';
  $('#ginfo').innerHTML =
    '<span style="color:' + RED + '">■</span> красный — ' + (l ? 'левый' : 'правый') + ' глаз<br>' +
    '<span style="color:' + GREEN + '">■</span> зелёный — ' + (l ? 'правый' : 'левый') + ' глаз';
}
swap.addEventListener('change', () => { showGlasses(); render(); });
showGlasses();

/* ---------- лог ---------- */
const LOG = [];
function log(e) {
  e.scene = cur; e.time = new Date().toISOString();
  LOG.push(e);
  $('#last').textContent = JSON.stringify(e, null, 1);
}
$('#dl').onclick = () => {
  const data = { glasses: Object.assign({}, GL, { redEyeActual: redEye() }), params: P, log: LOG };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = 'log_' + new Date().toISOString().slice(0, 19).replace(/:/g, '-') + '.json';
  a.click();
};

/* ---------- «взгляд» = курсор ---------- */
let gaze = null;
stage.addEventListener('mousemove', e => {
  const r = stage.getBoundingClientRect();
  gaze = { x: e.clientX - r.left, y: e.clientY - r.top };
});
stage.addEventListener('mouseleave', () => gaze = null);

/* ---------- движок сцен ---------- */
let cur = 0, run = 0;
const alive = my => my === run;

function newCanvas() {
  const c = document.createElement('canvas');
  c.className = 'rds';
  c.style.cssText = 'display:block;width:100%;height:100%';
  c.width = stage.clientWidth; c.height = stage.clientHeight;
  stage.appendChild(c);
  return c;
}
function rndPos(c, m) {
  return { x: m + Math.random() * (c.width - 2 * m), y: m + Math.random() * (c.height - 2 * m) };
}

// проба: пауза gap → стимул → ждём фиксацию в ROI (dwell) или таймаут
function trial(my, name, draw) {
  setTimeout(() => {
    if (!alive(my)) return;
    const tg = draw(newCanvas());
    const t0 = performance.now();
    let inSince = null;
    (function tick() {
      if (!alive(my)) return;
      const now = performance.now();
      const inside = gaze && Math.hypot(gaze.x - tg.x, gaze.y - tg.y) <= P.roi_center_radius_px;
      if (inside) {
        if (inSince === null) inSince = now;
        if (now - inSince >= P.dwell_window_ms) return finish(true, Math.round(inSince - t0));
      } else inSince = null;
      if (now - t0 >= P.stimulus_max_ms) return finish(false, null);
      requestAnimationFrame(tick);
    })();
    function finish(hit, latency) {
      log({ name, hit, latency_ms: latency, target: { x: Math.round(tg.x), y: Math.round(tg.y) }, redEye: redEye() });
      stage.innerHTML = '';
      setTimeout(() => {
        if (!alive(my)) return;
        if (cur < SCENES.length - 1) go(cur + 1);
        else stage.innerHTML = '<p style="color:#fff;font-size:28px;text-align:center;margin-top:20%">Готово. Скачайте JSON-лог.</p>';
      }, P.gap_ms);
    }
  }, P.gap_ms);
}

// цветная точка: жёлтая — видят оба глаза, красная/зелёная — только один
function dotScene(name, color) {
  return my => trial(my, name, c => {
    const g = c.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
    const p = rndPos(c, 120);
    g.fillStyle = color; g.beginPath(); g.arc(p.x, p.y, 30, 0, 2 * Math.PI); g.fill();
    return p;
  });
}
